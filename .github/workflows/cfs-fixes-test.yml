---
# Tests of the parts of the fork that cfs and OpenList rely on

name: cfs-fixes-test

on:
  push:
    branches:
      - cfs-fixes
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test vfs and serve nfs
        env:
          RCLONE_CONFIG: /notfound
        run: go test ./vfs/... ./cmd/serve/nfs/...
